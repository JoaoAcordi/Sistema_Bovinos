# Configuração do perfil 'local' usando H2 em modo de compatibilidade PostgreSQL
# Permite rodar a aplicação localmente sem a necessidade de container Docker
spring.datasource.url=jdbc:h2:mem:boichip;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Valida o schema contra as tabelas criadas pelas migrations do Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway ativo para aplicar as migrations em src/main/resources/db/migration
spring.flyway.enabled=true

# Swagger OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
